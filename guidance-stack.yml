AWSTemplateFormatVersion: 2010-09-09
Description: (SO9403) Guidance - External Connectivity to Amazon VPC Lattice
Transform: 'AWS::LanguageExtensions'

Parameters:
  AllowedIPv4Block:
    Description: IPv4 CIDR block for the allowed IP address range on the NLB
    Type: String
  AllowedIPv6Block:
    Description: IPv6 CIDR block for the allowed IP address range on the NLB
    Type: String
    Default: EMPTY
  VpcCidr:
    Type: String
    Default: 192.168.1.0/16
    Description: IPv4 CIDR block for the VPC
    AllowedPattern: "^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\\/(?:[0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: Must be a valid IPv4 CIDR block (e.g., 192.168.1.0/16)
  ProxyEngine:
    Type: String
    Default: nginx
    AllowedValues:
      - nginx
      - envoy
    Description: >-
      Proxy engine to deploy. The matching proxies/<engine>/ directory is seeded
      into the CodeCommit repository at stack creation. NGINX is the simplest
      TLS-passthrough option; Envoy provides the same passthrough behavior on a
      more extensible data plane.
  SourceRepoUrl:
    Type: String
    Default: https://github.com/aws-solutions-library-samples/guidance-for-external-connectivity-amazon-vpc-lattice.git
    Description: >-
      Git URL used ONCE at stack creation to seed the CodeCommit repository with the selected proxy source. Point this at your own fork to bootstrap from custom code.
  SourceRepoBranch:
    Type: String
    Default: main
    Description: Branch of SourceRepoUrl to seed the CodeCommit repository from.

Conditions:
  Ipv6Provided: !Not [!Equals [!Ref AllowedIPv6Block, EMPTY]]

Mappings:
  SubnetCIDR:
    Position: 
      PublicSubneta: 0
      PublicSubnetb: 1
      PublicSubnetc: 2
      PrivateSubneta: 3
      PrivateSubnetb: 4
      PrivateSubnetc: 5
      EndpointSubneta: 6
      EndpointSubnetb: 7
      EndpointSubnetc: 8
  Endpoint:
    Type:
      ECRDKR: ecr.dkr
      ECRAPI: ecr.api
      Logs: logs
      SSM: ssm
      SSMMessages: ssmmessages
      EC2Messages: ec2messages

Resources:
  # ---------- AMAZON VPC RESOURCES ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - vpc
              - !Ref AWS::StackName

  IPv6CidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
        AmazonProvidedIpv6CidrBlock: true
        VpcId: !Ref VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # For::Each iteration: per subnet type (Public, Private, Endpoint) and AZ (3 AZs)
  # Resources to create: 9 subnets, 9 route tables, 9 route table associations - obtaining AZ affinity
  'Fn::ForEach::SubnetTypes':
    - SubnetType
    - [Public, Private, Endpoint]
    - '${SubnetType}':
      'Fn::ForEach::AZ':
        - AvailabilityZone
        - [a, b, c]
          # Subnets
        - '${SubnetType}Subnet${AvailabilityZone}':
            Type: AWS::EC2::Subnet
            # Ensure the Amazon-provided IPv6 CIDR is associated to the VPC before
            # subnets evaluate !Select [0, VPC.Ipv6CidrBlocks]; otherwise the list is
            # empty and deployment fails with "Fn::Select cannot select nonexistent
            # value at index 0".
            DependsOn: IPv6CidrBlock
            Properties:
              VpcId: !Ref VPC
              AvailabilityZone: !Sub ${AWS::Region}${AvailabilityZone}
              CidrBlock: !Select [!FindInMap [SubnetCIDR, Position, 'Fn::Sub': '${SubnetType}Subnet${AvailabilityZone}'], !Cidr [!Ref VpcCidr, 9, 8 ]]
              Ipv6CidrBlock: !Select [!FindInMap [SubnetCIDR, Position, 'Fn::Sub': '${SubnetType}Subnet${AvailabilityZone}'], !Cidr [!Select [0, !GetAtt VPC.Ipv6CidrBlocks], 9, 64 ]]
              Tags:
                - Key: Name
                  Value: !Join
                    - '-'
                    - - !Sub subnet-${SubnetType}-AZ${AvailabilityZone}
                      - !Ref AWS::StackName
          # Route Tables
          '${SubnetType}RouteTable${AvailabilityZone}':
            Type: AWS::EC2::RouteTable
            Properties:
              VpcId: !Ref VPC
              Tags: 
                - Key: Name
                  Value: !Join
                    - '-'
                    - - !Sub rt-${SubnetType}-AZ${AvailabilityZone}
                      - !Ref AWS::StackName
          # Route Table associations
          '${SubnetType}RouteTableAssociation${AvailabilityZone}':
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties: 
              RouteTableId: !Ref
                'Fn::Sub': '${SubnetType}RouteTable${AvailabilityZone}'
              SubnetId: !Ref
                'Fn::Sub': '${SubnetType}Subnet${AvailabilityZone}'

  # For::Each iteration: per AZ (3 AZs)
  # VPC routes from public subnets to the Internet gateway
  'Fn::ForEach::VPCroutes':
    - AvailabilityZone
    - [a, b, c]
    - 'Ipv4Route${AvailabilityZone}':
        DependsOn:
          - InternetGatewayAttachment
        Type: AWS::EC2::Route
        Properties:
          DestinationCidrBlock: 0.0.0.0/0
          RouteTableId: !Ref
            'Fn::Sub': 'PublicRouteTable${AvailabilityZone}'
          GatewayId: !Ref InternetGateway
      'Ipv6Route${AvailabilityZone}':
        DependsOn:
          - InternetGatewayAttachment
        Type: AWS::EC2::Route
        Properties:
          DestinationIpv6CidrBlock: ::/0
          RouteTableId: !Ref
            'Fn::Sub': 'PublicRouteTable${AvailabilityZone}'
          GatewayId: !Ref InternetGateway

  # ---------- VPC ENDPOINTS ----------
  # For::Each iteration: per Endpoint Type
  # Interface endpoints
  'Fn::ForEach::VPCendpoints':
    - EndpointType
    - [ECRDKR, ECRAPI, Logs, SSM, SSMMessages, EC2Messages]
    - 'InterfaceEndpoint${EndpointType}':
        Type: AWS::EC2::VPCEndpoint
        Properties: 
          PrivateDnsEnabled: true
          SecurityGroupIds: 
            - !Ref EndpointSecurityGroup
          ServiceName: !Join
            - '.'
            - - com.amazonaws
              - !Sub ${AWS::Region}
              - !FindInMap [Endpoint, Type, 'Fn::Sub': '${EndpointType}']
          SubnetIds: 
            - !Ref EndpointSubneta
            - !Ref EndpointSubnetb
            - !Ref EndpointSubnetc
          VpcEndpointType: Interface
          VpcId: !Ref VPC

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: 
      RouteTableIds: 
        - !Ref PrivateRouteTablea
        - !Ref PrivateRouteTableb
        - !Ref PrivateRouteTablec
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      VpcId: !Ref VPC

  # ---------- SECURITY GROUPS ----------
  # Network Load Balancer
  ProxyNLBSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Proxy NLB Security Group
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Sub '${ProxyEngine}-nlb-sg'
              - !Ref AWS::StackName

  # IPv4 Ingress rule (NLB) & Egress rule (TLS-only: port 443)
  ProxyNLBSGIPv4IngressHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ProxyNLBSG
      CidrIp: !Ref AllowedIPv4Block
      IpProtocol: 'tcp'
      FromPort: 443
      ToPort: 443

  ProxyNLBSGEgressHTTPS:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ProxyNLBSG
      DestinationSecurityGroupId: !Ref ProxyECSSG
      IpProtocol: 'tcp'
      FromPort: 443
      ToPort: 443

  # IPv6 Ingress rule (NLB) - if provided
  ProxyNLBSGIPv6IngressHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: Ipv6Provided
    Properties:
      GroupId: !Ref ProxyNLBSG
      CidrIpv6: !Ref AllowedIPv6Block
      IpProtocol: 'tcp'
      FromPort: 443
      ToPort: 443

  # ECS Cluster
  ProxyECSSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Proxy (ECS) Security group
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: '-1'
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Sub '${ProxyEngine}-ecs-sg'
              - !Ref AWS::StackName
  
  # ECS ingress rule from the NLB (TLS-only: port 443)
  ProxyECSSGIngressHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ProxyECSSG
      SourceSecurityGroupId: !Ref ProxyNLBSG
      IpProtocol: 'tcp'
      FromPort: 443
      ToPort: 443

  # VPC endpoints
  EndpointSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VPC
      GroupDescription: VPC Endpoint Security Group
      SecurityGroupIngress:
        - CidrIp: !Ref VpcCidr
          IpProtocol: 'tcp'
          FromPort: 443
          ToPort: 443
          Description: Ingress rule for HTTPS
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: '-1'
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Sub endpoint-sg
              - !Ref AWS::StackName

  # ---------- NETWORK LOAD BALANCER ----------
  ProxyNLB:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      IpAddressType: dualstack
      Scheme: internet-facing
      Type: network
      SecurityGroups: 
        - !Ref ProxyNLBSG
      Subnets:
        - !Ref PublicSubneta
        - !Ref PublicSubnetb
        - !Ref PublicSubnetc

  # Target Group: 443
  ProxyNLBTGroupHTTPS:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 2
      HealthyThresholdCount: 3
      IpAddressType: ipv4
      Port: 443
      Protocol: TCP
      TargetGroupAttributes:
        - Key: proxy_protocol_v2.enabled
          Value: true
      TargetType: ip
      UnhealthyThresholdCount: 3
      VpcId: !Ref VPC

  # Listener: 443
  ProxyNLBListenerHTTPS:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref ProxyNLBTGroupHTTPS
          Type: forward
      LoadBalancerArn: !Ref ProxyNLB
      Port: 443
      Protocol: TCP

  # ---------- AMAZON ECR REPOSITORY ----------
  LatticeExternalConnectivityECRRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true

  # ---------- CODECOMMIT (proxy source of truth) ----------
  # Seeded once at stack creation from SourceRepoUrl with the selected proxy engine.
  # After deployment this is the user-editable source: a commit triggers the pipeline.
  # Retained on stack deletion so proxy customizations committed here are not lost.
  ProxySourceRepo:
    Type: AWS::CodeCommit::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-${ProxyEngine}-source'
      RepositoryDescription: !Sub 'Editable proxy source for ${AWS::StackName}. Commits trigger build and deploy.'

  # ---------- ECS CLUSTER ----------
  ProxyCluster:
    Type: 'AWS::ECS::Cluster'
    Properties:
      CapacityProviders:
        - FARGATE
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ECS Task
  # Initial task definition references the image built by the bootstrap stage
  # (tag: bootstrap). Subsequent deploys are driven by CodePipeline's ECS deploy
  # action, which registers new task-def revisions with immutable commit-based tags.
  ProxyTask:
    DependsOn:
      - ProxyBootstrapCustomResource
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      ExecutionRoleArn: !Ref ProxyTaskExecRole
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${LatticeExternalConnectivityECRRepo}:bootstrap"
          Name: Proxy
          PortMappings:
            - ContainerPort: 443
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref 'AWS::Region'
              awslogs-group: !Ref ProxyLogGroup
              awslogs-stream-prefix: lattice-externalconnectivity
          Ulimits:
            - HardLimit: 1048576
              Name: nofile
              SoftLimit: 1048576
      Cpu: 2048
      Memory: 4096
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !Ref ProxyTaskRole

  # ECS Service
  ProxyService:
    Type: 'AWS::ECS::Service'
    DependsOn:
      - ProxyNLBListenerHTTPS
    Properties:
      Cluster: !Ref ProxyCluster
      EnableExecuteCommand: true
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: Proxy
          ContainerPort: 443
          TargetGroupArn: !Ref ProxyNLBTGroupHTTPS
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref ProxyECSSG
          Subnets:
            - !Ref PrivateSubneta
            - !Ref PrivateSubnetb
            - !Ref PrivateSubnetc
      SchedulingStrategy: REPLICA
      TaskDefinition: !Ref ProxyTask

  # ECS Task Execution Role
  ProxyTaskExecRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: ecs-actions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'ssmmessages:CreateControlChannel'
                  - 'ssmmessages:CreateDataChannel'
                  - 'ssmmessages:OpenControlChannel'
                  - 'ssmmessages:OpenDataChannel'
                Resource: '*'

  # ECS Task Role
  ProxyTaskRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: ecs-actions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'ssmmessages:CreateControlChannel'
                  - 'ssmmessages:CreateDataChannel'
                  - 'ssmmessages:OpenControlChannel'
                  - 'ssmmessages:OpenDataChannel'
                Resource: '*'

  # CloudWatch Log Group
  ProxyLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: !Sub '/${ProxyCluster}'

  # AutoScaling - Scalable Target
  ProxyScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties: 
      MaxCapacity: 9
      MinCapacity: 3
      ResourceId: !Join ['',['service/',!Ref ProxyCluster,'/',!GetAtt ProxyService.Name]]
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
      ScalableDimension: 'ecs:service:DesiredCount'
      ServiceNamespace: 'ecs'
      
  # AutoScaling Policy
  ProxyScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties: 
      PolicyName: !Join ['',['scaling-policy-',!GetAtt ProxyService.Name]]
      PolicyType: 'TargetTrackingScaling'
      ResourceId: !Join ['',['service/',!Ref ProxyCluster,'/',!GetAtt ProxyService.Name]]
      ScalableDimension: 'ecs:service:DesiredCount'
      ScalingTargetId: !Ref ProxyScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  # ========== CI/CD PIPELINE ==========
  # Flow: edit CodeCommit -> CodePipeline (Source) -> Build (CodeBuild: build & push
  # immutable commit-tagged image, emit imagedefinitions.json) -> Deploy (ECS rolling
  # update). The bootstrap stage (custom resource) seeds CodeCommit from SourceRepoUrl
  # and produces the initial ':bootstrap' image so the ECS service can start.

  # ---------- PIPELINE ARTIFACT BUCKET ----------
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # ---------- BOOTSTRAP (seed CodeCommit + build initial image) ----------
  BootstrapProjectRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-${ProxyEngine}-bootstrap'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-${ProxyEngine}-bootstrap:*'
        - PolicyName: CodeCommitSeed
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codecommit:GetRepository
                  - codecommit:GetBranch
                  - codecommit:GitPull
                  - codecommit:GitPush
                Resource: !GetAtt ProxySourceRepo.Arn
        - PolicyName: ECRPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${LatticeExternalConnectivityECRRepo}'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'

  BootstrapProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-${ProxyEngine}-bootstrap'
      Description: 'Seed CodeCommit from SourceRepoUrl and build the initial proxy image'
      ServiceRole: !GetAtt BootstrapProjectRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY
            Value: !Ref LatticeExternalConnectivityECRRepo
          - Name: AWS_ACCOUNT_ID
            Value: !Ref 'AWS::AccountId'
          - Name: CC_REPO_NAME
            Value: !GetAtt ProxySourceRepo.Name
          - Name: CC_BRANCH
            Value: !Ref SourceRepoBranch
          - Name: SOURCE_REPO_URL
            Value: !Ref SourceRepoUrl
          - Name: SOURCE_REPO_BRANCH
            Value: !Ref SourceRepoBranch
          - Name: PROXY_ENGINE
            Value: !Ref ProxyEngine
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - pip install --quiet git-remote-codecommit
            build:
              commands:
                - |
                  set -euo pipefail
                  if aws codecommit get-branch --repository-name "$CC_REPO_NAME" --branch-name "$CC_BRANCH" >/dev/null 2>&1; then
                    echo "CodeCommit repo already seeded on branch $CC_BRANCH; skipping seed (preserving user edits)."
                  else
                    echo "Seeding CodeCommit from $SOURCE_REPO_URL@$SOURCE_REPO_BRANCH (engine: $PROXY_ENGINE)"
                    git clone --depth 1 --branch "$SOURCE_REPO_BRANCH" "$SOURCE_REPO_URL" /tmp/src
                    if [ ! -d "/tmp/src/proxies/$PROXY_ENGINE" ]; then
                      echo "ERROR: proxies/$PROXY_ENGINE not found in source repo"; exit 1
                    fi
                    mkdir -p /tmp/seed
                    cp -a "/tmp/src/proxies/$PROXY_ENGINE/." /tmp/seed/
                    cd /tmp/seed
                    git init -b "$CC_BRANCH"
                    git config user.email "bootstrap@guidance.local"
                    git config user.name "stack-bootstrap"
                    git remote add origin "codecommit::$AWS_REGION://$CC_REPO_NAME"
                    git add .
                    git commit -m "Initial seed: $PROXY_ENGINE proxy from $SOURCE_REPO_URL@$SOURCE_REPO_BRANCH"
                    git push origin "$CC_BRANCH"
                  fi
            post_build:
              commands:
                - |
                  set -euo pipefail
                  aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
                  rm -rf /tmp/cc
                  git clone --depth 1 "codecommit::$AWS_REGION://$CC_REPO_NAME" /tmp/cc
                  cd /tmp/cc
                  docker build -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:bootstrap" .
                  docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:bootstrap"
      TimeoutInMinutes: 12

  # Lambda-backed custom resource: runs the bootstrap build on stack create and waits
  # until the ':bootstrap' image exists in ECR before the ECS service is created.
  BootstrapLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: BootstrapControl
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt BootstrapProject.Arn

  BootstrapLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt BootstrapLambdaRole.Arn
      Runtime: python3.13
      Timeout: 900
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time
          import json
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info('Received event: %s', json.dumps(event))
              physical_id = event.get('PhysicalResourceId') or 'proxy-bootstrap'

              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
                  return

              props = event['ResourceProperties']
              project_name = props['ProjectName']

              try:
                  codebuild = boto3.client('codebuild')
                  build_id = codebuild.start_build(projectName=project_name)['build']['id']
                  logger.info('Bootstrap build started: %s', build_id)

                  # Poll until the build finishes, leaving headroom before Lambda timeout.
                  deadline = time.time() + 840
                  status = 'IN_PROGRESS'
                  while status == 'IN_PROGRESS' and time.time() < deadline:
                      time.sleep(15)
                      status = codebuild.batch_get_builds(ids=[build_id])['builds'][0]['buildStatus']

                  logger.info('Bootstrap build status: %s', status)
                  if status == 'SUCCEEDED':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                       {'BuildId': build_id}, physical_id)
                  else:
                      cfnresponse.send(event, context, cfnresponse.FAILED,
                                       {'Reason': f'Bootstrap build {build_id} status: {status}'},
                                       physical_id)
              except Exception as e:
                  logger.exception('Bootstrap failed')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)}, physical_id)

  ProxyBootstrapCustomResource:
    Type: Custom::ProxyBootstrap
    DependsOn:
      - ProxySourceRepo
    Properties:
      ServiceToken: !GetAtt BootstrapLambda.Arn
      ProjectName: !Ref BootstrapProject

  # ---------- IMAGE BUILD (pipeline build stage) ----------
  ImageBuildProjectRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-${ProxyEngine}-image-build'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-${ProxyEngine}-image-build:*'
        - PolicyName: ECRPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${LatticeExternalConnectivityECRRepo}'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
        - PolicyName: ArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub '${PipelineArtifactBucket.Arn}/*'

  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-${ProxyEngine}-image-build'
      Description: 'Build and push the proxy image from CodeCommit source (pipeline build stage)'
      ServiceRole: !GetAtt ImageBuildProjectRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY
            Value: !Ref LatticeExternalConnectivityECRRepo
          - Name: AWS_ACCOUNT_ID
            Value: !Ref 'AWS::AccountId'
          - Name: CONTAINER_NAME
            Value: Proxy
      Source:
        Type: CODEPIPELINE
        # buildspec.yml is provided by the CodeCommit source (proxies/<engine>/buildspec.yml)
      TimeoutInMinutes: 15

  # ---------- CODEPIPELINE ----------
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt PipelineArtifactBucket.Arn
                  - !Sub '${PipelineArtifactBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:GetRepository
                  - codecommit:UploadArchive
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:CancelUploadArchive
                Resource: !GetAtt ProxySourceRepo.Arn
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt ImageBuildProject.Arn
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ProxyTaskExecRole.Arn
                  - !GetAtt ProxyTaskRole.Arn
                Condition:
                  StringEqualsIfExists:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  ProxyPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: !GetAtt ProxySourceRepo.Name
                BranchName: !Ref SourceRepoBranch
                PollForSourceChanges: 'false'
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref ImageBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: '1'
              Configuration:
                ClusterName: !Ref ProxyCluster
                ServiceName: !GetAtt ProxyService.Name
                FileName: imagedefinitions.json
              InputArtifacts:
                - Name: BuildOutput

  # EventBridge rule: trigger the pipeline on commits to the tracked branch.
  PipelineTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProxyPipeline}'

  PipelineTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Description: !Sub 'Trigger ${AWS::StackName} proxy pipeline on CodeCommit commits'
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !GetAtt ProxySourceRepo.Arn
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref SourceRepoBranch
      Targets:
        - Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProxyPipeline}'
          Id: ProxyPipeline
          RoleArn: !GetAtt PipelineTriggerRole.Arn

Outputs:
  VpcId:
    Description: Ingress VPC ID
    Value: !Ref VPC
  NLBDomainName:
    Description: NLB Domain Name
    Value: !GetAtt ProxyNLB.DNSName
  NLBHostedZoneId:
    Description: NLB Hosted Zone ID
    Value: !GetAtt ProxyNLB.CanonicalHostedZoneID
  ProxySourceRepoCloneUrlHttp:
    Description: HTTPS clone URL for the editable proxy source (CodeCommit). Commits trigger the pipeline.
    Value: !GetAtt ProxySourceRepo.CloneUrlHttp
  ProxySourceRepoName:
    Description: CodeCommit repository name for the proxy source
    Value: !GetAtt ProxySourceRepo.Name
  ProxyPipelineName:
    Description: CodePipeline that builds and deploys proxy changes
    Value: !Ref ProxyPipeline
  ECRRepositoryName:
    Description: ECR repository holding the proxy images
    Value: !Ref LatticeExternalConnectivityECRRepo