user nginx;
worker_processes auto;
pid /run/nginx.pid;

# NOTE: The official NGINX image is built with the stream module compiled in,
# so there is no load_module directive here. If you switch to a base image where
# the stream module is a separate dynamic module, add the appropriate
# "load_module .../ngx_stream_module.so;" line back.

events {
        worker_connections 1048576;
        multi_accept on;
        use epoll;
}

# TLS-only by default: the proxy performs TLS passthrough on 443, reading the SNI
# without decrypting traffic. This keeps the connection encrypted end-to-end from
# the external client all the way to the VPC Lattice service.
# To add an HTTP listener (cleartext passthrough or HTTP->HTTPS redirect), see the
# snippets under proxies/customizations/. Plaintext HTTP is NOT recommended for
# external exposure.

stream {

    resolver 169.254.169.253 ipv6=off;

    map $bytes_received $notAHealthCheck {
    "~0"            0;
    default         1;
    }

    server {
        listen 443 proxy_protocol;
        proxy_pass $ssl_preread_server_name:$server_port;
        ssl_preread on;
        set_real_ip_from 192.168.0.0/16;
    }
    
    log_format  basic   '$time_iso8601 $remote_addr $proxy_protocol_addr $proxy_protocol_port $protocol $server_port '
                        '$status $upstream_addr $upstream_bytes_sent $upstream_bytes_received $session_time  $upstream_connect_time';

    access_log  /var/log/nginx/stream_access.log basic if=$notAHealthCheck;
    error_log   /var/log/nginx/stream_error.log crit;

}
